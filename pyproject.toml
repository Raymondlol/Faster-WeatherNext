[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-weathernext"
version = "0.1.0"
description = "Run WeatherNext 2 at full 0.25-degree resolution on consumer GPUs (8 GB+), exactly and faster. Unofficial."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Raymond Huang" }]
dependencies = [
  # Validated versions (docs/validation.md). The patch relies on weathernext internals: keep pinned.
  "jax==0.11.2",
  "weathernext @ git+https://github.com/google-deepmind/weathernext.git@f2f2c5117d2f864e2d5e7c2f9f220db5e1049dd3",
  "numpy>=2.1",
  "scipy",
  "pandas",
  "xarray",
  "h5netcdf",
  "h5py",
  "fsspec[http]",
  "eccodes",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.11.2"]
cuda13 = ["jax[cuda13]==0.11.2"]
test = ["pytest"]

[project.scripts]
fwn = "faster_weathernext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
